<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
<defs><marker id="marrow1d3b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#1d3b53"/></marker><marker id="marrow1a8a8f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#1a8a8f"/></marker><marker id="marrowe0954a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#e0954a"/></marker><marker id="marrowc0504d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#c0504d"/></marker></defs>
<rect x="14" y="14" width="380" height="272" rx="8" ry="8" fill="#f2f5f7" stroke="#9fb3c1" stroke-width="1.4"/>
<text x="204.0" y="34.6" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.6" font-weight="700" fill="#41525f" text-anchor="middle">CloudTrail 事件（本书实验 9-2 的真实调用，已脱敏）</text>
<text x="26" y="58" font-family="'Cascadia Mono',Consolas,monospace" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="start">{ &quot;eventTime&quot;: &quot;2026-11-17T09:31:31Z&quot;,</text>
<text x="26" y="78" font-family="'Cascadia Mono',Consolas,monospace" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="start">  &quot;eventSource&quot;: &quot;events.amazonaws.com&quot;,</text>
<text x="26" y="98" font-family="'Cascadia Mono',Consolas,monospace" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="start">  &quot;eventName&quot;: &quot;TestEventPattern&quot;,</text>
<text x="26" y="118" font-family="'Cascadia Mono',Consolas,monospace" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="start">  &quot;awsRegion&quot;: &quot;us-east-1&quot;,</text>
<text x="26" y="138" font-family="'Cascadia Mono',Consolas,monospace" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="start">  &quot;readOnly&quot;: true, &quot;eventCategory&quot;: &quot;Management&quot;,</text>
<text x="26" y="158" font-family="'Cascadia Mono',Consolas,monospace" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="start">  &quot;userIdentity&quot;: { &quot;type&quot;: &quot;IAMUser&quot;,</text>
<text x="26" y="178" font-family="'Cascadia Mono',Consolas,monospace" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="start">     &quot;arn&quot;: &quot;arn:aws:iam::111122223333:user/&lt;user&gt;&quot; },</text>
<text x="26" y="198" font-family="'Cascadia Mono',Consolas,monospace" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="start">  &quot;sourceIPAddress&quot;: &quot;203.0.113.x&quot;,</text>
<text x="26" y="218" font-family="'Cascadia Mono',Consolas,monospace" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="start">  &quot;requestParameters&quot;: { &quot;eventPattern&quot;: …, &quot;event&quot;: … },</text>
<text x="26" y="238" font-family="'Cascadia Mono',Consolas,monospace" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="start">  &quot;errorCode&quot;: null,</text>
<text x="26" y="258" font-family="'Cascadia Mono',Consolas,monospace" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="start">  &quot;eventID&quot;: &quot;27f32a68-…&quot; }</text>
<path d="M394 54 L418 54" fill="none" stroke="#1d3b53" stroke-width="1.2" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<text x="424" y="58" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="600" fill="#1d3b53" text-anchor="start">时间一律是 UTC（本机在 UTC+13）</text>
<path d="M394 94 L418 94" fill="none" stroke="#1d3b53" stroke-width="1.2" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<text x="424" y="98" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="600" fill="#1d3b53" text-anchor="start">服务 + API：先确认“是不是要找的那类调用”</text>
<path d="M394 134 L418 134" fill="none" stroke="#1a8a8f" stroke-width="1.2" marker-end="url(#marrow1a8a8f)" stroke-linejoin="round"/>
<text x="424" y="138" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="600" fill="#1a8a8f" text-anchor="start">只读调用也会记录；用 ReadOnly=false 只看写操作</text>
<path d="M394 174 L418 174" fill="none" stroke="#e0954a" stroke-width="1.2" marker-end="url(#marrowe0954a)" stroke-linejoin="round"/>
<text x="424" y="178" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="600" fill="#e0954a" text-anchor="start">AssumedRole 时还要看 sessionIssuer 与会话名</text>
<path d="M394 214 L418 214" fill="none" stroke="#c0504d" stroke-width="1.2" marker-end="url(#marrowc0504d)" stroke-linejoin="round"/>
<text x="424" y="218" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="600" fill="#c0504d" text-anchor="start">敏感参数可能被隐藏：isRedacted / HIDDEN_DUE_…</text>
<path d="M394 254 L418 254" fill="none" stroke="#c0504d" stroke-width="1.2" marker-end="url(#marrowc0504d)" stroke-linejoin="round"/>
<text x="424" y="258" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="600" fill="#c0504d" text-anchor="start">失败的调用也有事件：errorCode ≠ null 不改变状态</text>
</svg>
