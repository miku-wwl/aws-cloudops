<text x="280.0" y="145.7075" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="700" fill="#41525f" text-anchor="middle">投递通道</text>
<text x="280.0" y="162.16250000000002" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9" font-weight="400" fill="#5d6d7a" text-anchor="middle">配置历史 → S3 桶</text>
<path d="M280 94 L280 124" fill="none" stroke="#5d6d7a" stroke-width="1.2" marker-end="url(#marrow5d6d7a)" stroke-linejoin="round"/>
<text x="94" y="118" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="600" fill="#2e7d55" text-anchor="middle">0.003 美元 / CI（连续）</text>
<text x="94" y="132" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9" font-weight="400" fill="#5d6d7a" text-anchor="middle">0.012 美元 / CI（每日）</text>
<text x="466" y="118" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="600" fill="#2e7d55" text-anchor="middle">0.001 美元 / 次评估</text>
<text x="466" y="132" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9" font-weight="400" fill="#5d6d7a" text-anchor="middle">（每月前 10 万次）</text>
<rect x="390" y="146" width="356" height="92" rx="5" ry="5" fill="#fdf1e3" stroke="#e0954a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="398" y="161.2" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="700" fill="#9a5a1c" text-anchor="start">易错点</text>
<text x="398" y="174.54" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="start">一个账户的一个区域只能有一个“客户托管”记录器</text>
<text x="398" y="187.88" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="start">（另有 AWS 服务创建的服务关联记录器）</text>
<text x="398" y="201.22" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="start">记录 S3 类型 = 记录本区域所有桶，不只是实验桶</text>
<text x="398" y="214.56" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="start">没有评估结果 ≠ 合规；规则范围外的资源不会被评估</text>
</svg>
