<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
<defs><marker id="marrow5d6d7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#5d6d7a"/></marker></defs>
<rect x="14" y="112" width="136" height="72" rx="8" ry="8" fill="#e9eff5" stroke="#1d3b53" stroke-width="1.4"/>
<text x="82.0" y="138.0445" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#17384f" text-anchor="middle">一次 API 调用</text>
<text x="82.0" y="155.4175" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">PutBucketTagging</text>
<text x="82.0" y="168.76549999999997" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">（某个身份、某个时刻）</text>
<rect x="220" y="38" width="300" height="66" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="370.0" y="61.181" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#9a5a1c" text-anchor="middle">行为证据 · CloudTrail</text>
<text x="370.0" y="78.095" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">谁、何时、调用了什么、成功与否</text>
<text x="370.0" y="91.15899999999999" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">事件历史：管理事件、90 天、单区域</text>
<path d="M150 148 L220 71" fill="none" stroke="#5d6d7a" stroke-width="1.3" marker-end="url(#marrow5d6d7a)" stroke-linejoin="round"/>
<rect x="220" y="118" width="300" height="66" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="370.0" y="141.181" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#12676b" text-anchor="middle">现状证据 · S3 API</text>
<text x="370.0" y="158.095" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">此刻的标签集是什么</text>
<text x="370.0" y="171.159" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">get-bucket-tagging：立即反映</text>
<path d="M150 148 L220 151" fill="none" stroke="#5d6d7a" stroke-width="1.3" marker-end="url(#marrow5d6d7a)" stroke-linejoin="round"/>
<rect x="220" y="198" width="300" height="66" rx="8" ry="8" fill="#f1edf8" stroke="#6f55a8" stroke-width="1.4"/>
<text x="370.0" y="221.181" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#4f3a86" text-anchor="middle">评价证据 · AWS Config</text>
<text x="370.0" y="238.095" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">配置项（CI）→ 规则评估 → 合规结果</text>
<text x="370.0" y="251.159" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">异步：几分钟后才有结论</text>
<path d="M150 148 L220 231" fill="none" stroke="#5d6d7a" stroke-width="1.3" marker-end="url(#marrow5d6d7a)" stroke-linejoin="round"/>
<rect x="568" y="38" width="178" height="66" rx="8" ry="8" fill="#ffffff" stroke="#b8c7d2" stroke-width="1.4"/>
<text x="578" y="66.5" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9" font-weight="400" fill="#22313d" text-anchor="start">能证明：调用发生过、结果码</text>
<text x="578" y="79.28" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9" font-weight="400" fill="#22313d" text-anchor="start">不能证明：此刻的状态</text>
<rect x="568" y="118" width="178" height="66" rx="8" ry="8" fill="#ffffff" stroke="#b8c7d2" stroke-width="1.4"/>
<text x="578" y="146.5" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9" font-weight="400" fill="#22313d" text-anchor="start">能证明：当前事实</text>
<text x="578" y="159.28" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9" font-weight="400" fill="#22313d" text-anchor="start">不能证明：是谁、何时改的</text>
<rect x="568" y="198" width="178" height="66" rx="8" ry="8" fill="#ffffff" stroke="#b8c7d2" stroke-width="1.4"/>
<text x="578" y="226.5" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9" font-weight="400" fill="#22313d" text-anchor="start">能证明：某次评估时不合规</text>
<text x="578" y="239.28" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9" font-weight="400" fill="#22313d" text-anchor="start">不能证明：操作者是谁</text>
<path d="M520 71 L568 71" fill="none" stroke="#5d6d7a" stroke-width="1.2" marker-end="url(#marrow5d6d7a)" stroke-linejoin="round"/>
<path d="M520 151 L568 151" fill="none" stroke="#5d6d7a" stroke-width="1.2" marker-end="url(#marrow5d6d7a)" stroke-linejoin="round"/>
<path d="M520 231 L568 231" fill="none" stroke="#5d6d7a" stroke-width="1.2" marker-end="url(#marrow5d6d7a)" stroke-linejoin="round"/>
<text x="380" y="22" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="700" fill="#1d3b53" text-anchor="middle">调查顺序：先锁定时间窗和资源 → 行为 → 现状 → 评价；三者不是一条自动调用链</text>
<text x="380" y="290" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="600" fill="#c0504d" text-anchor="middle">预防（SCP / RCP / IAM）作用在“调用之前”；以上三份证据都发生在“调用之后”</text>
</svg>
