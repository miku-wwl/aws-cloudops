<text x="22" y="127.6" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="start">只有激活之后的用量才按标签归类；激活前的历史可由管理账户“回填”最多 12 个月（每 24 小时一次）。</text>
<text x="22" y="141.51999999999998" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="start">并非所有费用都能按资源标签分摊：税费、部分订阅与共享费用会落在“无标签”组里。</text>
<text x="22" y="155.43999999999997" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="start">标签中途改名或改值，不会自动重写旧用量的归属。</text>
