<rect x="40" y="34" width="250" height="96" rx="8" ry="8" fill="#f1edf8" stroke="#6f55a8" stroke-width="1.4"/>
<text x="165.0" y="64.5185" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#4f3a86" text-anchor="middle">主动 Proactive · 235 项</text>
<text x="165.0" y="82.4595" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">部署前：CloudFormation Hook</text>
<text x="165.0" y="96.3755" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">检查模板里的资源属性</text>
<text x="165.0" y="110.2915" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">不合规 → 栈操作失败，资源不创建</text>
<rect x="300" y="34" width="200" height="96" rx="8" ry="8" fill="#e9eff5" stroke="#1d3b53" stroke-width="1.4"/>
<text x="400.0" y="64.5185" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#17384f" text-anchor="middle">预防 Preventive · 69 项</text>
<text x="400.0" y="82.4595" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">请求时：SCP / RCP / 声明式策略</text>
<text x="400.0" y="96.3755" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">授权阶段显式 Deny</text>
<text x="400.0" y="110.2915" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">动作根本不会发生</text>
<rect x="510" y="34" width="226" height="96" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="623.0" y="64.5185" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#12676b" text-anchor="middle">检测 Detective · 1309 项</text>
<text x="623.0" y="82.4595" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">发生后：AWS Config 规则</text>
<text x="623.0" y="96.3755" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">持续评估已存在的资源</text>
<text x="623.0" y="110.2915" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">NON_COMPLIANT → 发现与告警</text>
<text x="165" y="200" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">例：模板中的 S3 桶未开启版本控制</text>
<text x="165" y="218" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#6f55a8" text-anchor="middle">→ Hook 返回 FAILED，栈回滚</text>
<text x="400" y="200" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">例：成员账户为 root 创建访问密钥</text>
<text x="400" y="218" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#1d3b53" text-anchor="middle">→ SCP 显式拒绝 AccessDenied</text>
<text x="623" y="200" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">例：已有桶被人改成公开可读</text>
<text x="623" y="218" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#1a8a8f" text-anchor="middle">→ 规则判定不合规，事后发现</text>
<text x="380" y="252" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9" font-weight="400" fill="#5d6d7a" text-anchor="middle">数字为 2026-11-17 Control Catalog（us-east-1）中三种行为的控制数量</text>
