<rect x="370" y="70" width="368" height="38" rx="8" ry="8" fill="#ffffff" stroke="#b8c7d2" stroke-width="1.4"/>
<text x="380" y="84.19999999999999" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="start">NotInUse → 独立账户：向导第 2 步会新建组织，</text>
<text x="380" y="97.832" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="start">本账户成为管理账户（之后不能更换）</text>
<rect x="370" y="114" width="368" height="30" rx="8" ry="8" fill="#fbeceb" stroke="#c0504d" stroke-width="1.4"/>
<text x="380" y="131.016" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="start">AccessDenied → 权限不足，不能据此下结论</text>
<rect x="370" y="182" width="368" height="38" rx="8" ry="8" fill="#fbeceb" stroke="#c0504d" stroke-width="1.4"/>
