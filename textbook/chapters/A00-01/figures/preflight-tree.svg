<text x="380" y="209.832" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="start">组织的管理账户中设置</text>
<rect x="370" y="254" width="368" height="38" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="380" y="268.2" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="start">有 ARN → get-landing-zone 看版本 / 状态 / 漂移，</text>
<text x="380" y="281.832" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="start">走 Update 流程，绝不重复创建</text>
