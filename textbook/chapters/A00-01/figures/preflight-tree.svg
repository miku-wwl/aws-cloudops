<text x="164.0" y="215.23350000000002" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">MasterAccountId == 当前 Account ?</text>
