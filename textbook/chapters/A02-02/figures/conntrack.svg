<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
<defs><marker id="marrow1d3b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#1d3b53"/></marker><marker id="marrow2e7d55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#2e7d55"/></marker></defs>
<text x="110" y="22" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="700" fill="#1d3b53" text-anchor="middle">Client 10.40.1.10:49152</text>
<text x="470" y="22" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="700" fill="#1d3b53" text-anchor="middle">Server 10.40.1.20:8080</text>
<line x1="110" y1="30" x2="110" y2="190" stroke="#b8c7d2" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="470" y1="30" x2="470" y2="190" stroke="#b8c7d2" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M110 60 L470 60" fill="none" stroke="#1d3b53" stroke-width="1.6" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<text x="290" y="53" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="600" fill="#1d3b53" text-anchor="middle">① SYN：新连接，Client 出站 + Server 入站规则都要匹配</text>
<path d="M470 110 L110 110" fill="none" stroke="#2e7d55" stroke-width="1.6" marker-end="url(#marrow2e7d55)" stroke-linejoin="round"/>
<text x="290" y="103" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="600" fill="#2e7d55" text-anchor="middle">② SYN-ACK：已跟踪连接的回包，自动放行</text>
<path d="M110 160 L470 160" fill="none" stroke="#2e7d55" stroke-width="1.6" marker-end="url(#marrow2e7d55)" stroke-linejoin="round"/>
<text x="290" y="153" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="600" fill="#2e7d55" text-anchor="middle">③ ACK / 数据：同一连接，双向自动放行</text>
<rect x="520" y="40" width="226" height="140" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="633.0" y="79.816" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.8" font-weight="700" fill="#9a5a1c" text-anchor="middle">删除 / 收紧规则之后</text>
<text x="633.0" y="96.944" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">已跟踪的连接：不受影响，</text>
<text x="633.0" y="110.292" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">直到空闲超时才结束</text>
<text x="633.0" y="123.64" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">（TCP 默认 432000 秒；</text>
<text x="633.0" y="136.988" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">Nitro v6 为 350 秒）</text>
<text x="633.0" y="150.336" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">新连接：立即按新规则判断</text>
<rect x="24" y="206" width="722" height="78" rx="8" ry="8" fill="#f2f5f7" stroke="#9fb3c1" stroke-width="1.4"/>
<text x="34" y="228.16400000000002" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.8" font-weight="700" fill="#41525f" text-anchor="start">例外：不被跟踪的流（untracked）</text>
<text x="34" y="245.29200000000003" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#5d6d7a" text-anchor="start">入站对 0.0.0.0/0（或 ::/0）放行某 TCP/UDP 流，且出站对全网放行全部端口时，该流不被跟踪；</text>
<text x="34" y="258.64000000000004" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#5d6d7a" text-anchor="start">回包靠反方向的规则放行。删除这类规则会立刻切断现有连接。ICMP 总是被跟踪；</text>
<text x="34" y="271.98800000000006" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#5d6d7a" text-anchor="start">经 NAT 网关、NLB、接口终端节点、Lambda Hyperplane ENI 等的连接会被自动跟踪。</text>
</svg>
