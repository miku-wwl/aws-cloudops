<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
<defs><marker id="marrow1d3b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#1d3b53"/></marker></defs>
<rect x="20" y="20" width="220" height="64" rx="8" ry="8" fill="#e9eff5" stroke="#1d3b53" stroke-width="1.4"/>
<text x="130.0" y="42.122" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.8" font-weight="700" fill="#17384f" text-anchor="middle">① 取“评估范围”的数据点</text>
<text x="130.0" y="58.965999999999994" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">比 N 多取几个（文档示例：N=3 取 5）</text>
<text x="130.0" y="72.02999999999999" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">最新的在右边</text>
<rect x="270" y="20" width="220" height="64" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="380.0" y="42.122" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.8" font-weight="700" fill="#12676b" text-anchor="middle">② 最近 N 个都在？</text>
<text x="380.0" y="58.965999999999994" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">是 → 只看这 N 个</text>
<text x="380.0" y="72.02999999999999" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">（缺失处理用不上）</text>
<rect x="520" y="20" width="220" height="64" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="630.0" y="42.122" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.8" font-weight="700" fill="#12676b" text-anchor="middle">③ 范围内真实点 ≥ N？</text>
<text x="630.0" y="58.965999999999994" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">是 → 用最近 N 个真实点</text>
<text x="630.0" y="72.02999999999999" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">（缺失处理仍用不上）</text>
<path d="M240 52 L270 52" fill="none" stroke="#1d3b53" stroke-width="1.6" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<path d="M490 52 L520 52" fill="none" stroke="#1d3b53" stroke-width="1.6" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="496.3" y="37.07" width="17.4" height="12.22" rx="3" ry="3" fill="#ffffff" stroke="none" stroke-width="1.2" opacity="0.92"/>
<text x="505.0" y="46.0" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="500" fill="#1d3b53" text-anchor="middle">否</text>
<rect x="270" y="110" width="470" height="64" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="505.0" y="132.122" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.8" font-weight="700" fill="#9a5a1c" text-anchor="middle">④ 真实点不足 N：按 treat_missing_data 补齐</text>
<text x="505.0" y="148.966" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">notBreaching → 补“好点”；breaching → 补“坏点”；</text>
<text x="505.0" y="162.03" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">missing → 全缺时 INSUFFICIENT_DATA；ignore → 全缺时保持原状态</text>
<path d="M630 84 L630 110" fill="none" stroke="#1d3b53" stroke-width="1.6" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="635.3" y="94.07" width="17.4" height="12.22" rx="3" ry="3" fill="#ffffff" stroke="none" stroke-width="1.2" opacity="0.92"/>
<text x="644.0" y="103.0" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="500" fill="#1d3b53" text-anchor="middle">否</text>
<rect x="270" y="192" width="470" height="60" rx="8" ry="8" fill="#f1edf8" stroke="#6f55a8" stroke-width="1.4"/>
<text x="505.0" y="212.122" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.8" font-weight="700" fill="#4f3a86" text-anchor="middle">⑤ 过早告警保护（missing / ignore）</text>
<text x="505.0" y="228.966" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">真实点少于 M 时，只有最早的越界点已至少 M 期“老”、其后全是越界或缺失，</text>
<text x="505.0" y="242.03" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">才判 ALARM（ignore 保持原状态）；否则先等更多数据</text>
<path d="M505 174 L505 192" fill="none" stroke="#1d3b53" stroke-width="1.6" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="20" y="110" width="222" height="142" rx="5" ry="5" fill="#f2f5f7" stroke="#9fb3c1" stroke-width="1" stroke-dasharray="4 3"/>
<text x="28" y="125.6" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="700" fill="#41525f" text-anchor="start">为什么停发后有延迟</text>
<text x="28" y="139.51999999999998" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#5d6d7a" text-anchor="start">停发数据后，旧的真实点</text>
<text x="28" y="153.43999999999997" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#5d6d7a" text-anchor="start">还会在评估范围里被反复</text>
<text x="28" y="167.35999999999996" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#5d6d7a" text-anchor="start">使用几分钟——</text>
<text x="28" y="181.27999999999994" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#5d6d7a" text-anchor="start">所以告警不会“立刻”变化。</text>
<text x="28" y="195.19999999999993" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#5d6d7a" text-anchor="start"></text>
<text x="28" y="209.11999999999992" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#5d6d7a" text-anchor="start">缩短 Period 可以缩短</text>
<text x="28" y="223.0399999999999" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#5d6d7a" text-anchor="start">这段“惯性”。</text>
</svg>
