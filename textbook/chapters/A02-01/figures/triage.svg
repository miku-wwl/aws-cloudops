<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
<defs><marker id="marrow1d3b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#1d3b53"/></marker></defs>
<rect x="270" y="14" width="220" height="44" rx="8" ry="8" fill="#e9eff5" stroke="#1d3b53" stroke-width="1.4"/>
<text x="380.0" y="39.54" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#17384f" text-anchor="middle">curl 的现象是什么？</text>
<rect x="20" y="92" width="220" height="84" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="130.0" y="116.37100000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#9a5a1c" text-anchor="middle">超时（timeout）</text>
<text x="130.0" y="134.137" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">包被静默丢弃：</text>
<text x="130.0" y="148.053" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">路由 / NACL / SG</text>
<text x="130.0" y="161.969" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">（SG 拒绝也是丢弃）</text>
<path d="M380 58 L130 92" fill="none" stroke="#1d3b53" stroke-width="1.3" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="270" y="92" width="220" height="84" rx="8" ry="8" fill="#fbeceb" stroke="#c0504d" stroke-width="1.4"/>
<text x="380.0" y="116.37100000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#8e2f2c" text-anchor="middle">连接被拒绝（refused）</text>
<text x="380.0" y="134.137" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">包到达了实例，</text>
<text x="380.0" y="148.053" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">但端口没有进程监听</text>
<text x="380.0" y="161.969" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">（或主机防火墙 REJECT）</text>
<path d="M380 58 L380 92" fill="none" stroke="#1d3b53" stroke-width="1.3" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="520" y="92" width="220" height="84" rx="8" ry="8" fill="#f1edf8" stroke="#6f55a8" stroke-width="1.4"/>
<text x="630.0" y="123.32900000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#4f3a86" text-anchor="middle">HTTP 4xx / 5xx</text>
<text x="630.0" y="141.095" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">网络已通，</text>
<text x="630.0" y="155.011" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#22313d" text-anchor="middle">问题在应用层</text>
<path d="M380 58 L630 92" fill="none" stroke="#1d3b53" stroke-width="1.3" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="20" y="196" width="720" height="50" rx="8" ry="8" fill="#f2f5f7" stroke="#9fb3c1" stroke-width="1.4"/>
<text x="30" y="216.1" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#5d6d7a" text-anchor="start">超时时的检查顺序：源/目的 IP 与端口 → 两端子网的路由表 → 两端子网 NACL（双向、临时端口） →</text>
<text x="30" y="230.016" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#5d6d7a" text-anchor="start">两端 SG → 用 Reachability Analyzer 或 VPC 流日志（REJECT 记录）取证；不要先把 SG 改成 0.0.0.0/0</text>
</svg>
