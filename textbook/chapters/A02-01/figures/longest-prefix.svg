<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">

<text x="24" y="24" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#1d3b53" text-anchor="start">rt-private（加上 NAT 后）</text>
<rect x="24" y="36" width="300" height="30" rx="0" ry="0" fill="#eef4f7" stroke="#d0dbe3" stroke-width="1"/>
<text x="36" y="56" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.4" font-weight="700" fill="#1d3b53" text-anchor="start">目的地</text>
<text x="172" y="56" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.4" font-weight="700" fill="#1d3b53" text-anchor="start">目标</text>
<text x="290" y="56" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.4" font-weight="700" fill="#1d3b53" text-anchor="middle">前缀长度</text>
<rect x="24" y="66" width="300" height="30" rx="0" ry="0" fill="#ffffff" stroke="#d0dbe3" stroke-width="1"/>
<text x="36" y="86" font-family="'Cascadia Mono',Consolas,monospace" font-size="10.4" font-weight="400" fill="#22313d" text-anchor="start">10.20.0.0/16</text>
<text x="172" y="86" font-family="'Cascadia Mono',Consolas,monospace" font-size="10.4" font-weight="400" fill="#22313d" text-anchor="start">local</text>
<text x="290" y="86" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.4" font-weight="400" fill="#22313d" text-anchor="middle">/16</text>
<rect x="24" y="96" width="300" height="30" rx="0" ry="0" fill="#ffffff" stroke="#d0dbe3" stroke-width="1"/>
<text x="36" y="116" font-family="'Cascadia Mono',Consolas,monospace" font-size="10.4" font-weight="400" fill="#22313d" text-anchor="start">10.20.2.0/24</text>
<text x="172" y="116" font-family="'Cascadia Mono',Consolas,monospace" font-size="10.4" font-weight="400" fill="#22313d" text-anchor="start">（假设）eni-…</text>
<text x="290" y="116" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.4" font-weight="400" fill="#22313d" text-anchor="middle">/24</text>
<rect x="24" y="126" width="300" height="30" rx="0" ry="0" fill="#ffffff" stroke="#d0dbe3" stroke-width="1"/>
<text x="36" y="146" font-family="'Cascadia Mono',Consolas,monospace" font-size="10.4" font-weight="400" fill="#22313d" text-anchor="start">0.0.0.0/0</text>
<text x="172" y="146" font-family="'Cascadia Mono',Consolas,monospace" font-size="10.4" font-weight="400" fill="#22313d" text-anchor="start">nat-…</text>
<text x="290" y="146" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.4" font-weight="400" fill="#22313d" text-anchor="middle">/0</text>
<rect x="380" y="30" width="360" height="60" rx="8" ry="8" fill="#f2f5f7" stroke="#9fb3c1" stroke-width="1.4"/>
<text x="390" y="54.900000000000006" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="400" fill="#5d6d7a" text-anchor="start">规则：只看目的 IP；在所有“包含它”的路由里，</text>
<text x="390" y="69.384" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="400" fill="#5d6d7a" text-anchor="start">选前缀最长（最具体）的一条。端口与协议不参与。</text>
<rect x="380" y="110" width="170" height="58" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="465.0" y="128.495" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.6" font-weight="700" fill="#12676b" text-anchor="middle">目的 10.20.2.20</text>
<text x="465.0" y="145.837" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">命中 /16、/24、/0</text>
<text x="465.0" y="159.469" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">→ /24（最具体）</text>
<rect x="570" y="110" width="170" height="58" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="655.0" y="128.495" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.6" font-weight="700" fill="#9a5a1c" text-anchor="middle">目的 8.8.8.8</text>
<text x="655.0" y="145.837" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">只命中 /0</text>
<text x="655.0" y="159.469" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">→ nat-…</text>
<rect x="380" y="182" width="360" height="54" rx="8" ry="8" fill="#fbeceb" stroke="#c0504d" stroke-width="1.4"/>
<text x="390" y="204.0" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="400" fill="#22313d" text-anchor="start">没有 0.0.0.0/0 时，8.8.8.8 一条都不命中 → 没有路可走；</text>
<text x="390" y="218.2" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="400" fill="#22313d" text-anchor="start">请求连 NACL 和 SG 都不会到达。</text>
<text x="24" y="186" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#5d6d7a" text-anchor="start">local 路由由 VPC 自动维护，覆盖整个</text>
<text x="24" y="204" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#5d6d7a" text-anchor="start">VPC CIDR，不能删除；更具体的路由</text>
<text x="24" y="222" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#5d6d7a" text-anchor="start">可以把子网间流量引向防火墙等中间设备。</text>
</svg>
