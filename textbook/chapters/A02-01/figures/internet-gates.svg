<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
<defs><marker id="marrow1d3b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#1d3b53"/></marker></defs>
<rect x="30" y="40" width="150" height="70" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="105.0" y="64.76050000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#12676b" text-anchor="middle">① 路由</text>
<text x="105.0" y="82.4175" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">子网路由表有</text>
<text x="105.0" y="96.04950000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">0.0.0.0/0 → igw</text>
<path d="M180 75 L208 75" fill="none" stroke="#1d3b53" stroke-width="1.5" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="208" y="40" width="150" height="70" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="283.0" y="64.76050000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#12676b" text-anchor="middle">② 公网地址</text>
<text x="283.0" y="82.4175" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">实例有公网 IPv4</text>
<text x="283.0" y="96.04950000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">（或弹性 IP）</text>
<path d="M358 75 L386 75" fill="none" stroke="#1d3b53" stroke-width="1.5" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="386" y="40" width="150" height="70" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="461.0" y="64.76050000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#12676b" text-anchor="middle">③ SG / NACL</text>
<text x="461.0" y="82.4175" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">出站与回包</text>
<text x="461.0" y="96.04950000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">都被允许</text>
<path d="M536 75 L564 75" fill="none" stroke="#1d3b53" stroke-width="1.5" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="564" y="40" width="150" height="70" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="639.0" y="64.76050000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#12676b" text-anchor="middle">④ 区域开关</text>
<text x="639.0" y="82.4175" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">VPC Block Public</text>
<text x="639.0" y="96.04950000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">Access 未阻断</text>
<text x="380" y="24" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.8" font-weight="700" fill="#1d3b53" text-anchor="middle">从 VPC 内直接访问互联网（经 IGW）必须同时满足：</text>
<text x="380" y="140" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="400" fill="#22313d" text-anchor="middle">私有子网的标准做法是：0.0.0.0/0 → NAT 网关（NAT 自己在公有子网、有弹性 IP）</text>
<text x="380" y="160" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="400" fill="#5d6d7a" text-anchor="middle">只访问 S3 / DynamoDB：网关终端节点即可，免 NAT 费用；其他 AWS 服务可用接口终端节点（PrivateLink）</text>
</svg>
