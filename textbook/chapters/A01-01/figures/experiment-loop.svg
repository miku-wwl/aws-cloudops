<text x="233.0" y="95.41749999999999" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">FAIL_RATE = 0.2</text>
<text x="233.0" y="109.0495" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">或 FIS 50% 错误</text>
