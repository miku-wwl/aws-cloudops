<rect x="279.35" y="154.5" width="201.29999999999995" height="13.0" rx="3" ry="3" fill="#ffffff" stroke="none" stroke-width="1.2" opacity="0.92"/>
<text x="380.0" y="164.0" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="500" fill="#5d6d7a" text-anchor="middle">把发现写回设计与 Runbook，再进入下一轮</text>
<text x="380" y="215" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#c0504d" text-anchor="middle">护栏：只在实验账户执行；限定目标与比例；设置停止条件；提前确认回滚路径</text>
<text x="380" y="236" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#5d6d7a" text-anchor="middle">实验证明的是“我们能发现并恢复这一类故障”，而不是“系统已经可靠”</text>
