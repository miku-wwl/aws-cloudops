<text x="529.0" y="77.7605" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#8e2f2c" text-anchor="middle">④ 停止 / 恢复</text>
<text x="529.0" y="95.41749999999999" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">停止条件触发</text>
<text x="529.0" y="109.0495" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#22313d" text-anchor="middle">重新 plan 回滚</text>
