<text x="144" y="110.556" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.3" font-weight="400" fill="#22313d" text-anchor="start">或 DHMC（IMDSv2、Agent ≥ 3.2.582.0）；凭证都来自 IMDS</text>
