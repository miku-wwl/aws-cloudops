<text x="345" y="214" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="600" fill="#1d3b53" text-anchor="middle">总超时 = --timeout-seconds（送达）+ 文档的 executionTimeout（执行）</text>
<rect x="210" y="228" width="470" height="52" rx="5" ry="5" fill="#fdf1e3" stroke="#e0954a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="218" y="243.4" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="start">Success 只说明“Agent 收到了、退出码为 0”：不代表业务健康，</text>
<text x="218" y="257.03000000000003" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="start">以标签为目标却一台都没匹配到时，命令也会以 Success 结束——要看 TargetCount</text>
</svg>
