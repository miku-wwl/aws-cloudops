# 第 07 讲实验 7-4：GitHub Actions 通过 OIDC 扮演角色，读取（但不打印）秘密。
# 放到仓库的 .github/workflows/ 下；在 Settings → Variables 设置 A07_ROLE_ARN、A07_SECRET_ARN（只是 ARN，不是秘密）。
name: a07-oidc-secret-probe
on: workflow_dispatch

permissions:
  id-token: write   # 允许本 job 向 GitHub 申请 OIDC 令牌
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # 生产环境请把 @v6 固定为具体的提交 SHA
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.A07_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: a07-probe-${{ github.run_id }}

      - name: 第 1 层：身份（AssumeRoleWithWebIdentity 是否成功）
        run: aws sts get-caller-identity --query Arn --output text

      - name: 第 2、3 层：GetSecretValue（隐含 KMS Decrypt）——只输出成败，不输出值
        env:
          SECRET_ARN: ${{ vars.A07_SECRET_ARN }}
        run: |
          if out=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" --query VersionId --output text 2>&1); then
            echo "GetSecretValue 成功（VersionId=$out），值未打印"
          else
            echo "GetSecretValue 失败：$(echo "$out" | grep -o 'An error occurred ([A-Za-z]*)')"
            echo "$out" | grep -o 'kms:Decrypt' >/dev/null && echo "提示：错误信息提到 kms:Decrypt → 第 3 层（KMS）"
            exit 1
          fi
