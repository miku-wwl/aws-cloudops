<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
<defs><marker id="marrow5d6d7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#5d6d7a"/></marker></defs>
<rect x="14" y="14" width="732" height="64" rx="8" ry="8" fill="#1d3b53" stroke="#1d3b53" stroke-width="1.4"/>
<text x="380.0" y="42.724000000000004" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">治理平面：AWS Control Tower（着陆区）</text>
<text x="380.0" y="60.556000000000004" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#dbe6ee" text-anchor="middle">OU 基线（AWSControlTowerBaseline）· 控制（预防 / 检测 / 主动）· 账户纳管与漂移 · 4.0 起各服务集成可选、可只用控制</text>
<rect x="14" y="100" width="172" height="92" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="100.0" y="129.7965" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#12676b" text-anchor="middle">Account Factory / AFC</text>
<text x="100.0" y="146.8855" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">控制台或 API 开户</text>
<text x="100.0" y="159.9495" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">AFC：蓝图（CFN 或 TF）</text>
<text x="100.0" y="173.0135" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">适合：少量、手工开户</text>
<path d="M100 100 L100 78" fill="none" stroke="#5d6d7a" stroke-width="1.0" marker-end="url(#marrow5d6d7a)" stroke-linejoin="round"/>
<rect x="200" y="100" width="172" height="92" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="286.0" y="129.7965" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#9a5a1c" text-anchor="middle">AFT</text>
<text x="286.0" y="146.8855" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">Git 请求 + Terraform</text>
<text x="286.0" y="159.9495" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">全局 / 账户两级定制</text>
<text x="286.0" y="173.0135" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">适合：大量、GitOps 开户</text>
<path d="M286 100 L286 78" fill="none" stroke="#5d6d7a" stroke-width="1.0" marker-end="url(#marrow5d6d7a)" stroke-linejoin="round"/>
<rect x="386" y="100" width="172" height="92" rx="8" ry="8" fill="#f1edf8" stroke="#6f55a8" stroke-width="1.4"/>
<text x="472.0" y="129.7965" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#4f3a86" text-anchor="middle">CfCT</text>
<text x="472.0" y="146.8855" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">CloudFormation + SCP/RCP</text>
<text x="472.0" y="159.9495" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">按生命周期事件推送</text>
<text x="472.0" y="173.0135" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">适合：给 OU 推标准资源</text>
<path d="M472 100 L472 78" fill="none" stroke="#5d6d7a" stroke-width="1.0" marker-end="url(#marrow5d6d7a)" stroke-linejoin="round"/>
<rect x="572" y="100" width="172" height="92" rx="8" ry="8" fill="#e9eff5" stroke="#1d3b53" stroke-width="1.4"/>
<text x="658.0" y="129.7965" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#17384f" text-anchor="middle">LZA</text>
<text x="658.0" y="146.8855" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">配置文件 + CDK 流水线</text>
<text x="658.0" y="159.9495" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">网络 / 安全 / 日志一体</text>
<text x="658.0" y="173.0135" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">适合：受监管、复杂平台</text>
<path d="M658 100 L658 78" fill="none" stroke="#5d6d7a" stroke-width="1.0" marker-end="url(#marrow5d6d7a)" stroke-linejoin="round"/>
<text x="380" y="222" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#1d3b53" text-anchor="middle">它们可以组合使用（例如 Control Tower + AFT + CfCT），不是四选一；每个工具都有自己的状态与证据。</text>
<text x="380" y="244" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#5d6d7a" text-anchor="middle">LZA 推荐与 Control Tower 一起部署，也支持只基于 Organizations 的安装方式。</text>
</svg>
