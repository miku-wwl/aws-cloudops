<rect x="186" y="56" width="218" height="52" rx="8" ry="8" fill="#ffffff" stroke="#b8c7d2" stroke-width="1.4"/>
<text x="295.0" y="83.97399999999999" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">身份策略允许 s3:GetObject？</text>
<rect x="186" y="118" width="218" height="52" rx="8" ry="8" fill="#ffffff" stroke="#b8c7d2" stroke-width="1.4"/>
<text x="295.0" y="139.4" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">桶策略没有显式 Deny？</text>
<text x="295.0" y="152.464" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">（非 TLS、TLS &lt; 1.2 …）</text>
<rect x="186" y="180" width="218" height="52" rx="8" ry="8" fill="#ffffff" stroke="#b8c7d2" stroke-width="1.4"/>
<text x="295.0" y="207.974" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">公开主体？→ BPA 先拦下</text>
