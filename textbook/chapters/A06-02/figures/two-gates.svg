<text x="464" y="34.0" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">第二道门：KMS（S3 代你调用）</text>
<rect x="472" y="56" width="258" height="52" rx="8" ry="8" fill="#ffffff" stroke="#b8c7d2" stroke-width="1.4"/>
<text x="601.0" y="77.4" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">密钥状态 Enabled？</text>
<text x="601.0" y="90.464" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">（PendingDeletion / Disabled → 失败）</text>
