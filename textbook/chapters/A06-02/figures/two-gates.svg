<text x="601.0" y="139.4" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">密钥策略点名了调用者，</text>
<text x="601.0" y="152.464" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">或委托给本账户 IAM（root 语句）？</text>
<rect x="472" y="180" width="258" height="52" rx="8" ry="8" fill="#ffffff" stroke="#b8c7d2" stroke-width="1.4"/>
<text x="601.0" y="201.4" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">委托时：身份策略允许 kms:Decrypt？</text>
<text x="601.0" y="214.464" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">（常加 kms:ViaService = s3.&lt;区域&gt;）</text>
<path d="M420 131 L456 131" fill="none" stroke="#1d3b53" stroke-width="1.6" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
