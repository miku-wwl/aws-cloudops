<text x="438.0" y="125.0" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9" font-weight="500" fill="#1d3b53" text-anchor="middle">Decrypt</text>
<text x="380" y="272" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="600" fill="#1d3b53" text-anchor="middle">任何一道门不过都返回 403 AccessDenied；写对象时第二道门检查 kms:GenerateDataKey（分段上传还要 kms:Decrypt）</text>
