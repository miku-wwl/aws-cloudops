<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
<defs><marker id="marrow1d3b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#1d3b53"/></marker></defs>
<rect x="14" y="14" width="232" height="62" rx="8" ry="8" fill="#e9eff5" stroke="#1d3b53" stroke-width="1.4"/>
<text x="130.0" y="41.713" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#17384f" text-anchor="middle">① 确认信号</text>
<text x="130.0" y="58.626999999999995" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">不是 [SAMPLE]；类型、资源、时间</text>
<rect x="262" y="14" width="232" height="62" rx="8" ry="8" fill="#e9eff5" stroke="#1d3b53" stroke-width="1.4"/>
<text x="378.0" y="41.713" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#17384f" text-anchor="middle">② 确认主体</text>
<text x="378.0" y="58.626999999999995" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">用户 / 角色 / 会话、来源 IP</text>
<rect x="510" y="14" width="232" height="62" rx="8" ry="8" fill="#e9eff5" stroke="#1d3b53" stroke-width="1.4"/>
<text x="626.0" y="41.713" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#17384f" text-anchor="middle">③ 还原访问</text>
<text x="626.0" y="58.626999999999995" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">事件与对象级记录</text>
<rect x="510" y="90" width="232" height="62" rx="8" ry="8" fill="#e9eff5" stroke="#1d3b53" stroke-width="1.4"/>
<text x="626.0" y="117.71300000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#17384f" text-anchor="middle">④ 数据影响</text>
<text x="626.0" y="134.627" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">读到了什么、读了多少</text>
<rect x="262" y="90" width="232" height="62" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="378.0" y="117.71300000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#9a5a1c" text-anchor="middle">⑤ 受控遏制</text>
<text x="378.0" y="134.627" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">按审批限制会话或路径</text>
<rect x="14" y="90" width="232" height="62" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="130.0" y="117.71300000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#9a5a1c" text-anchor="middle">⑥ 同一探针复验</text>
<text x="130.0" y="134.627" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">确认被阻止、无新 Finding</text>
<path d="M246 45 L262 45" fill="none" stroke="#1d3b53" stroke-width="1.3" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<path d="M494 45 L510 45" fill="none" stroke="#1d3b53" stroke-width="1.3" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
