<path d="M510 121 L494 121" fill="none" stroke="#1d3b53" stroke-width="1.3" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<path d="M262 121 L246 121" fill="none" stroke="#1d3b53" stroke-width="1.3" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="14" y="172" width="732" height="70" rx="5" ry="5" fill="#f2f5f7" stroke="#9fb3c1" stroke-width="1" stroke-dasharray="4 3"/>
<text x="22" y="187.4" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="700" fill="#41525f" text-anchor="start">证据来源</text>
<text x="22" y="201.03" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#5d6d7a" text-anchor="start">对象级证据从哪里来：GuardDuty S3 保护的 Finding 详情；你自己跟踪中的 S3 数据事件（默认不记录）；</text>
<text x="22" y="214.66" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#5d6d7a" text-anchor="start">KMS Decrypt 是管理事件，事件历史里查得到——但开启 Bucket Key 后，加密上下文只到“桶”，</text>
<text x="22" y="228.29" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#5d6d7a" text-anchor="start">而且调用次数大幅减少：省钱的同时也降低了 KMS 侧的审计粒度。</text>
</svg>
