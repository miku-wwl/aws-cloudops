<text x="22" y="237.4" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="start">关联（association）：从这个附件进入 TGW 的流量查哪张表——一个附件只能关联一张。</text>
<text x="22" y="251.03" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="start">传播（propagation）：附件的前缀装进哪些表——可以多张。两者都不会改 VPC 子网路由和本地路由。</text>
<text x="22" y="264.66" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="start">同一前缀：静态 &gt; 系统（1:1 NAT）&gt; 前缀列表 &gt; VPC 传播 &gt; DX &gt; Connect &gt; VPN；先比前缀长度。</text>
</svg>
