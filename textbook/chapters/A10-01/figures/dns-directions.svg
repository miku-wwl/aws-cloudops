<text x="22" y="251.03" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="start">端点安全组要放行 UDP 与 TCP 53；端点按网卡计费（0.125 美元/网卡·小时），每个端点至少两个网卡。</text>
<text x="22" y="264.66" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="start">DNS 通只证明名字解析成功；拿到 IP 之后的 TCP 路径要另外验证（图 17-3）。</text>
