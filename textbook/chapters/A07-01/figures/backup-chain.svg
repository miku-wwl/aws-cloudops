<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
<defs><marker id="marrow1d3b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#1d3b53"/></marker></defs>
<rect x="14" y="30" width="112" height="80" rx="8" ry="8" fill="#f2f5f7" stroke="#9fb3c1" stroke-width="1.4"/>
<text x="70.0" y="60.797" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="700" fill="#41525f" text-anchor="middle">计划 + 选择 + 角色</text>
<text x="70.0" y="76.579" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.6" font-weight="400" fill="#5d6d7a" text-anchor="middle">何时、存哪、留多久</text>
<text x="70.0" y="88.791" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.6" font-weight="400" fill="#5d6d7a" text-anchor="middle">保护哪个 ARN、谁来执行</text>
<path d="M126 70 L138 70" fill="none" stroke="#1d3b53" stroke-width="1.4" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="138" y="30" width="112" height="80" rx="8" ry="8" fill="#e9eff5" stroke="#1d3b53" stroke-width="1.4"/>
<text x="194.0" y="60.797" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="700" fill="#17384f" text-anchor="middle">备份作业</text>
<text x="194.0" y="76.579" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.6" font-weight="400" fill="#22313d" text-anchor="middle">CREATED → RUNNING</text>
<text x="194.0" y="88.791" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.6" font-weight="400" fill="#22313d" text-anchor="middle">→ COMPLETED</text>
<path d="M250 70 L262 70" fill="none" stroke="#1d3b53" stroke-width="1.4" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="262" y="30" width="112" height="80" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="318.0" y="60.797" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="700" fill="#12676b" text-anchor="middle">恢复点</text>
<text x="318.0" y="76.579" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.6" font-weight="400" fill="#22313d" text-anchor="middle">备份库中的一个</text>
<text x="318.0" y="88.791" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.6" font-weight="400" fill="#22313d" text-anchor="middle">时刻快照（ARN）</text>
<path d="M374 70 L386 70" fill="none" stroke="#1d3b53" stroke-width="1.4" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="386" y="30" width="112" height="80" rx="8" ry="8" fill="#f1edf8" stroke="#6f55a8" stroke-width="1.4"/>
<text x="442.0" y="60.797" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="700" fill="#4f3a86" text-anchor="middle">恢复作业</text>
<text x="442.0" y="76.579" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.6" font-weight="400" fill="#22313d" text-anchor="middle">按元数据创建</text>
<text x="442.0" y="88.791" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.6" font-weight="400" fill="#22313d" text-anchor="middle">一个新资源</text>
<path d="M498 70 L510 70" fill="none" stroke="#1d3b53" stroke-width="1.4" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="510" y="30" width="112" height="80" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="566.0" y="60.797" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="700" fill="#9a5a1c" text-anchor="middle">数据验证</text>
<text x="566.0" y="76.579" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.6" font-weight="400" fill="#22313d" text-anchor="middle">行数 · 金额 · 哈希</text>
<text x="566.0" y="88.791" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.6" font-weight="400" fill="#22313d" text-anchor="middle">对照恢复点时刻</text>
<path d="M622 70 L634 70" fill="none" stroke="#1d3b53" stroke-width="1.4" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="634" y="30" width="112" height="80" rx="8" ry="8" fill="#eaf5ee" stroke="#2e7d55" stroke-width="1.4"/>
<text x="690.0" y="60.797" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="700" fill="#1f5c3d" text-anchor="middle">业务验证</text>
<text x="690.0" y="76.579" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.6" font-weight="400" fill="#22313d" text-anchor="middle">冒烟测试 · 切流</text>
<text x="690.0" y="88.791" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.6" font-weight="400" fill="#22313d" text-anchor="middle">这一步才结束 RTO</text>
<text x="70" y="134" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.8" font-weight="600" fill="#c0504d" text-anchor="middle">只说明选中了什么</text>
<text x="194" y="134" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.8" font-weight="600" fill="#c0504d" text-anchor="middle">只说明备份动作完成</text>
<text x="318" y="134" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.8" font-weight="600" fill="#c0504d" text-anchor="middle">只说明有可恢复的副本</text>
<text x="442" y="134" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.8" font-weight="600" fill="#c0504d" text-anchor="middle">只说明新资源建好了</text>
<text x="566" y="134" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.8" font-weight="600" fill="#2e7d55" text-anchor="middle">说明数据回到了那个时刻</text>
<text x="690" y="134" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.8" font-weight="600" fill="#2e7d55" text-anchor="middle">说明业务恢复了</text>
<rect x="14" y="160" width="732" height="76" rx="8" ry="8" fill="#f6fafb" stroke="#dbe6ec" stroke-width="1"/>
<text x="380" y="186" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#1d3b53" text-anchor="middle">每一个绿色状态只证明它自己那一步</text>
<text x="380" y="208" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="400" fill="#22313d" text-anchor="middle">Backup COMPLETED ≠ 可恢复；Restore COMPLETED ≠ 数据正确；数据正确 ≠ 业务已恢复</text>
<text x="380" y="226" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#5d6d7a" text-anchor="middle">所以验收要分三层写：作业状态、数据比对、业务冒烟——缺哪层，结论就只能写到哪层</text>
</svg>
