<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
<defs><marker id="marrow1d3b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#1d3b53"/></marker></defs>
<rect x="16" y="40" width="132" height="70" rx="8" ry="8" fill="#e9eff5" stroke="#1d3b53" stroke-width="1.4"/>
<text x="82.0" y="71.866" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#17384f" text-anchor="middle">① DNS</text>
<text x="82.0" y="89.414" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">域名 → IP</text>
<rect x="16" y="120" width="132" height="64" rx="6" ry="6" fill="#fbeceb" stroke="#e2c7c5" stroke-width="0.9"/>
<text x="82" y="140" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="700" fill="#8e2f2c" text-anchor="middle">失败时的样子</text>
<text x="82" y="158" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">getaddrinfo 失败</text>
<text x="82" y="172" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">NXDOMAIN</text>
<path d="M148 75 L164 75" fill="none" stroke="#1d3b53" stroke-width="1.5" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="164" y="40" width="132" height="70" rx="8" ry="8" fill="#e6f3f3" stroke="#1a8a8f" stroke-width="1.4"/>
<text x="230.0" y="65.19200000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#12676b" text-anchor="middle">② 网络</text>
<text x="230.0" y="82.74000000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">路由 + NACL</text>
<text x="230.0" y="96.08800000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">+ 两端 SG</text>
<rect x="164" y="120" width="132" height="64" rx="6" ry="6" fill="#fbeceb" stroke="#e2c7c5" stroke-width="0.9"/>
<text x="230" y="140" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="700" fill="#8e2f2c" text-anchor="middle">失败时的样子</text>
<text x="230" y="158" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">连接超时</text>
<text x="230" y="172" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">（静默丢包）</text>
<path d="M296 75 L312 75" fill="none" stroke="#1d3b53" stroke-width="1.5" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="312" y="40" width="132" height="70" rx="8" ry="8" fill="#f1edf8" stroke="#6f55a8" stroke-width="1.4"/>
<text x="378.0" y="65.19200000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#4f3a86" text-anchor="middle">③ TLS</text>
<text x="378.0" y="82.74000000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">证书与主机名</text>
<text x="378.0" y="96.08800000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">是否匹配</text>
<rect x="312" y="120" width="132" height="64" rx="6" ry="6" fill="#fbeceb" stroke="#e2c7c5" stroke-width="0.9"/>
<text x="378" y="140" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="700" fill="#8e2f2c" text-anchor="middle">失败时的样子</text>
<text x="378" y="158" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">证书 / 主机名</text>
<text x="378" y="172" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">校验错误</text>
<path d="M444 75 L460 75" fill="none" stroke="#1d3b53" stroke-width="1.5" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="460" y="40" width="132" height="70" rx="8" ry="8" fill="#f2f5f7" stroke="#9fb3c1" stroke-width="1.4"/>
<text x="526.0" y="65.19200000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#41525f" text-anchor="middle">④ HTTP</text>
<text x="526.0" y="82.74000000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#5d6d7a" text-anchor="middle">服务返回</text>
<text x="526.0" y="96.08800000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#5d6d7a" text-anchor="middle">状态码</text>
<rect x="460" y="120" width="132" height="64" rx="6" ry="6" fill="#ecf6f0" stroke="#9ccbb0" stroke-width="0.9"/>
<text x="526" y="140" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="700" fill="#2e7d55" text-anchor="middle">成功的标志</text>
<text x="526" y="158" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">任何 HTTP 码</text>
<text x="526" y="172" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">都说明已到达服务</text>
<path d="M592 75 L608 75" fill="none" stroke="#1d3b53" stroke-width="1.5" marker-end="url(#marrow1d3b53)" stroke-linejoin="round"/>
<rect x="608" y="40" width="132" height="70" rx="8" ry="8" fill="#fdf1e3" stroke="#e0954a" stroke-width="1.4"/>
<text x="674.0" y="65.19200000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#9a5a1c" text-anchor="middle">⑤ 授权</text>
<text x="674.0" y="82.74000000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">IAM + 终端节点</text>
<text x="674.0" y="96.08800000000001" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.4" font-weight="400" fill="#22313d" text-anchor="middle">策略 + 资源策略</text>
<rect x="608" y="120" width="132" height="64" rx="6" ry="6" fill="#fbeceb" stroke="#e2c7c5" stroke-width="0.9"/>
<text x="674" y="140" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="700" fill="#8e2f2c" text-anchor="middle">失败时的样子</text>
<text x="674" y="158" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">AccessDenied</text>
<text x="674" y="172" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="400" fill="#22313d" text-anchor="middle">HTTP 403</text>
<text x="380" y="24" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.6" font-weight="700" fill="#1d3b53" text-anchor="middle">前一层成功，不代表后一层成功：要按层取证，并且一次只改变一个变量</text>
<rect x="16" y="206" width="728" height="76" rx="8" ry="8" fill="#f2f5f7" stroke="#9fb3c1" stroke-width="1.4"/>
<text x="26" y="232.142" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#5d6d7a" text-anchor="start">nslookup 成功 ≠ TCP 能建连；TCP 能建连 ≠ TLS 正常；TLS 正常 ≠ 有权限。</text>
<text x="26" y="246.058" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#5d6d7a" text-anchor="start">超时几乎总是网络层（②）的问题：先查客户端出站、终端节点 SG 入站、NACL，而不是 DNS 或 IAM；</text>
<text x="26" y="259.974" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.8" font-weight="400" fill="#5d6d7a" text-anchor="start">得到 AccessDenied 说明网络已通，此时放开安全组毫无用处。</text>
</svg>
